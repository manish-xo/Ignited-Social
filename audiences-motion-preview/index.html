        ↺ Replay animation

        Preview only, not part of the site. Growth numbers and months are the

        {

          headline: "Help people picture your product in their lives.",
          copy: "From handmade pieces to specialist equipment, people need to understand what you sell and why it’s for them. We help likely buyers discover your brand and make your products easier to explore.",
          benefits: [
            "Reach people your products are for",
            "Show what makes your products different",
            "Make your offer easier to explore",
          ],
          story: "Read BlueMag’s story",
          handle: "bluemagairsoft",
          name: "BlueMag Airsoft",
          bio: "Biodegradable airsoft BBs and components",
          growth: 2046,
          months: 5,
          quote:
            "We’d been stuck at roughly 4,000 followers for a long time. Seeing the audience grow was great. Seeing more people come through to the website was even better.",
          stage: "#e3e9f2",
          avatar: "linear-gradient(135deg,#1e3a8a,#3b82f6)",
          ring: "#cbd8ee",
          icons: ["box", "target"],
          tiles: [
            "#1e3a8a",

          ],
          followers: [
            "field.ops.fin",

      // ── Elements & state ───────────────────────────────────────
      const $ = (id) => document.getElementById(id);
      const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const fmt = (n) => n.toLocaleString("en-US");
      const COUNT_MS = 6500; // how long the count-up takes
      const TOAST_EVERY = 950; // a new follower notification every ~1s

      let selected = 0;
      let elapsed = 0; // ms of animation played for the current tab
      let last = 0;
      let raf = 0;
      let onScreen = true;
      let nextToast = 0;
      let toastIndex = 0;

      // ── Tabs ───────────────────────────────────────────────────
      const tabs = $("tabs");
      AUDIENCES.forEach((a, i) => {
        const b = document.createElement("button");
        b.className = "tab";
        b.type = "button";
        b.role = "tab";
        b.textContent = a.label;
        b.addEventListener("click", () => select(i));
        b.addEventListener("keydown", (e) => {
          if (e.key === "ArrowRight")
            select((selected + 1) % AUDIENCES.length, true);
          if (e.key === "ArrowLeft")
            select((selected - 1 + AUDIENCES.length) % AUDIENCES.length, true);
        });
        tabs.appendChild(b);
      });

      function movePill() {
        const tab = tabs.querySelectorAll(".tab")[selected];
        $("pill").style.left = tab.offsetLeft + "px";
        $("pill").style.width = tab.offsetWidth + "px";
      }

      // ── Render one audience ────────────────────────────────────
      function render() {
        const a = AUDIENCES[selected];
        tabs.querySelectorAll(".tab").forEach((t, i) => {
          t.setAttribute("aria-selected", i === selected);
          t.tabIndex = i === selected ? 0 : -1;
        });
        movePill();

        const stage = $("stage");
        stage.style.setProperty("--stage", a.stage);
        stage.style.setProperty("--avatar", a.avatar);
        stage.style.setProperty("--ring", a.ring);

        $("profile").innerHTML = `
          <div class="p-top">
            <span class="handle">@${a.handle}</span>
            <span class="live"><i></i>Growing</span>
          </div>
          <div class="p-head">
            <div class="avatar">${ICONS[a.icons[0]]}</div>
            <div class="stats">
              <div class="stat grow"><b id="count">+0</b><span>new followers</span></div>
              <div class="stat"><b id="month">0</b><span>of ${a.months} months</span></div>
            </div>
          </div>
          <p class="p-name">${a.name}</p>
          <p class="p-bio">${a.bio}</p>
          <div class="months">
            <div class="months-label"><span>Saved growth data</span><span id="month-label">Month 0 of ${a.months}</span></div>
            <div class="ticks" id="ticks">${"<span></span>".repeat(a.months)}</div>
          </div>
          <div class="grid">
            ${a.tiles
              .map(
                (c, i) =>
                  `<div class="tile" style="--t:${c};animation-delay:${i * 45}ms">${ICONS[a.icons[i % 3 === 1 ? 1 : 0]]}</div>`,
              )
              .join("")}
          </div>`;

        $("quote").innerHTML = `
          <small>From the customer · Proposed quote</small>
          <p>${a.quote}</p>
          <cite>— ${a.name}, ${a.bio.split(" · ")[0].toLowerCase()}</cite>`;

        $("pitch").innerHTML = `
          <span class="label">For ${a.label.toLowerCase()}</span>
          <h2>${a.headline}</h2>
          <p>${a.copy}</p>
          <ul>${a.benefits.map((b) => `<li>${b}</li>`).join("")}</ul>
          <a class="link" href="#">${a.story} →</a>`;

        ["profile", "pitch", "quote"].forEach((id) => {
          const el = $(id);
          el.classList.remove("swap");
          void el.offsetWidth;
          el.classList.add("swap");
        });

        $("toasts").innerHTML = "";
        elapsed = 0;
        nextToast = 400;
        toastIndex = 0;

        if (reduce) {
          // No motion: show the end state and three notifications.
          paint(1);
          for (let i = 0; i < 3; i++) addToast(false);
        }
      }

      // ── Animation ──────────────────────────────────────────────
      const easeOut = (t) => 1 - Math.pow(1 - t, 3);

      function paint(t) {
        const a = AUDIENCES[selected];
        const p = easeOut(t);
        $("count").textContent = "+" + fmt(Math.round(a.growth * p));
        const month = Math.min(a.months, Math.ceil(p * a.months));
        $("month").textContent = month;
        $("month-label").textContent = `Month ${month} of ${a.months}`;
        [...$("ticks").children].forEach((tick, i) =>
          tick.classList.toggle("on", i < month),
        );
      }

      function addToast(animate = true) {
        const a = AUDIENCES[selected];
        const name = a.followers[toastIndex % a.followers.length];
        toastIndex++;
        const box = $("toasts");
        const el = document.createElement("div");
        el.className = "toast";
        el.innerHTML = `<span class="dot">${name[0]}</span><span><b>@${name}</b> followed you<small>just now</small></span>`;
        box.prepend(el);
        // keep three on screen; the oldest drifts away
        const all = [...box.children].filter(
          (t) => !t.classList.contains("out"),
        );
        all.slice(3).forEach((old) => {
          old.classList.add("out");
          setTimeout(() => old.remove(), 450);
        });
        if (animate) {
          const count = $("count");
          count.classList.remove("bump");
          void count.offsetWidth;
          count.classList.add("bump");
        }
      }

      function tick(now) {
        const dt = last ? Math.min(now - last, 64) : 0;
        last = now;
        if (onScreen && !document.hidden) {
          elapsed += dt;
          paint(Math.min(elapsed / COUNT_MS, 1));
          // notifications arrive while it's growing, then settle
          if (elapsed < COUNT_MS && elapsed >= nextToast) {
            addToast();
            nextToast += TOAST_EVERY;
          }
        }
        raf = requestAnimationFrame(tick);
      }

      function select(i, focus = false) {
        if (i === selected && $("count")) return;
        selected = i;
        render();
        if (focus) tabs.querySelectorAll(".tab")[i].focus();
      }

      // Only animate while the story is on screen.
      new IntersectionObserver(([entry]) => (onScreen = entry.isIntersecting), {
        threshold: 0.3,
      }).observe($("story"));

      $("replay").addEventListener("click", render);
      addEventListener("resize", movePill);

      selected = -1;
      select(0);
      if (!reduce) raf = requestAnimationFrame(tick);
    </script>
